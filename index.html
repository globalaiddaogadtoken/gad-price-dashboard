<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GAD Token - Live Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js">
    </script>

    <style>
        /* ===== IMPORT FONTS ===== */
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #FFFFFF;
            direction: ltr;
            background: #05080F;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background:
                linear-gradient(rgba(255, 179, 0, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 179, 0, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 25s linear infinite;
        }

        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        .bg-glow {
            position: fixed;
            top: -30%;
            right: -15%;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(255, 179, 0, 0.12), transparent 70%);
            border-radius: 50%;
            z-index: 0;
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .bg-glow-2 {
            position: fixed;
            bottom: -30%;
            left: -15%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.08), transparent 70%);
            border-radius: 50%;
            z-index: 0;
            animation: pulseGlow 5s ease-in-out infinite reverse;
        }

        @keyframes pulseGlow {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        /* ===== SPARKLES ===== */
        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #FFB300;
            border-radius: 50%;
            z-index: 0;
            animation: sparkleFloat linear infinite;
            box-shadow: 0 0 10px #FFB300, 0 0 20px rgba(255, 179, 0, 0.3);
        }

        .sparkle:nth-child(1) {
            top: 10%;
            left: 5%;
            animation-duration: 8s;
        }
        .sparkle:nth-child(2) {
            top: 20%;
            right: 10%;
            animation-duration: 10s;
            animation-delay: 2s;
        }
        .sparkle:nth-child(3) {
            bottom: 30%;
            left: 15%;
            animation-duration: 7s;
            animation-delay: 4s;
        }
        .sparkle:nth-child(4) {
            top: 60%;
            right: 5%;
            animation-duration: 9s;
            animation-delay: 1s;
        }
        .sparkle:nth-child(5) {
            bottom: 10%;
            right: 20%;
            animation-duration: 11s;
            animation-delay: 3s;
        }
        .sparkle:nth-child(6) {
            top: 40%;
            left: 25%;
            animation-duration: 6s;
            animation-delay: 5s;
        }
        .sparkle:nth-child(7) {
            bottom: 50%;
            right: 35%;
            animation-duration: 12s;
            animation-delay: 2.5s;
        }
        .sparkle:nth-child(8) {
            top: 80%;
            left: 40%;
            animation-duration: 8.5s;
            animation-delay: 4.5s;
        }

        @keyframes sparkleFloat {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.2;
            }
            50% {
                transform: translateY(-40px) scale(2.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-80px) scale(1);
                opacity: 0.2;
            }
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(5, 8, 15, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 36px;
            padding: 32px 28px 36px;
            border: 1px solid rgba(255, 179, 0, 0.08);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 179, 0, 0.06);
            animation: floatIn 0.7s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes floatIn {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            font-size: 40px;
            color: #FFB300;
            filter: drop-shadow(0 0 30px rgba(255, 179, 0, 0.4));
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%,
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 30px rgba(255, 179, 0, 0.4));
            }
            50% {
                transform: scale(1.08);
                filter: drop-shadow(0 0 60px rgba(255, 179, 0, 0.6));
            }
        }

        .logo-text {
            font-size: 32px;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #FFB300, #FF6F00, #FFB300);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease-in-out infinite;
            letter-spacing: 3px;
            text-shadow: 0 0 40px rgba(255, 179, 0, 0.1);
        }

        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .logo-text small {
            font-size: 14px;
            font-weight: 500;
            color: #00D4FF;
            -webkit-text-fill-color: #00D4FF;
            letter-spacing: 4px;
            margin-left: 8px;
        }

        .trade-link {
            background: linear-gradient(135deg, rgba(255, 179, 0, 0.15), rgba(255, 179, 0, 0.04));
            border: 1.5px solid rgba(255, 179, 0, 0.15);
            border-radius: 40px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            color: #FFB300;
            text-decoration: none;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(255, 179, 0, 0.05);
        }

        .trade-link:hover {
            background: rgba(255, 179, 0, 0.15);
            box-shadow: 0 0 60px rgba(255, 179, 0, 0.15);
            transform: scale(1.05);
            border-color: #FFB300;
        }

        .divider {
            height: 2px;
            background: linear-gradient(to right, #FFB300, #00D4FF, transparent);
            margin: 4px 0 20px 0;
            border-radius: 4px;
            opacity: 0.2;
        }

        /* ===== PRICE SECTION ===== */
        .price-section {
            text-align: center;
            padding: 30px 0 24px 0;
            background: linear-gradient(180deg, rgba(255, 179, 0, 0.05), transparent);
            border-radius: 28px;
            border: 1px solid rgba(255, 179, 0, 0.04);
            margin-bottom: 20px;
            position: relative;
        }

        .price-section::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 15%;
            right: 15%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #FFB300, transparent);
            border-radius: 4px;
            opacity: 0.3;
        }

        .price-label {
            font-size: 16px;
            font-weight: 600;
            color: #4A5A7A;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-family: 'Rajdhani', sans-serif;
        }

        .price-value {
            font-size: 82px;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            color: #FFFFFF;
            line-height: 1;
            margin-top: 4px;
            text-shadow: 0 0 60px rgba(255, 179, 0, 0.08);
            letter-spacing: 2px;
        }

        .price-value .dollar {
            font-size: 44px;
            color: #4A5A7A;
            font-weight: 600;
        }

        .price-value .cents {
            font-size: 38px;
            color: #4A5A7A;
            font-weight: 600;
        }

        .price-change {
            display: inline-block;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            margin-top: 8px;
            letter-spacing: 1.5px;
        }

        .price-change.positive {
            color: #00FF88;
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.05);
        }

        .price-change.negative {
            color: #FF0055;
            background: rgba(255, 0, 85, 0.08);
            border: 1px solid rgba(255, 0, 85, 0.2);
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.05);
        }

        .price-change.neutral {
            color: #FFB300;
            background: rgba(255, 179, 0, 0.08);
            border: 1px solid rgba(255, 179, 0, 0.15);
        }

        .price-update-time {
            font-size: 13px;
            font-weight: 500;
            color: #3A4A5A;
            margin-top: 8px;
            letter-spacing: 1.5px;
            font-family: 'Rajdhani', sans-serif;
        }

        /* ===== GROWTH METRICS ===== */
        .growth-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .growth-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 16px 12px;
            text-align: center;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }

        .growth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 179, 0, 0.04), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .growth-card:hover::before {
            opacity: 1;
        }

        .growth-card:hover {
            border-color: rgba(255, 179, 0, 0.12);
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .growth-card .period {
            font-size: 12px;
            font-weight: 600;
            color: #4A5A7A;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            font-family: 'Rajdhani', sans-serif;
        }

        .growth-card .value {
            font-size: 28px;
            font-weight: 700;
            margin-top: 6px;
            font-family: 'Rajdhani', sans-serif;
        }

        .growth-card .value.positive {
            color: #00FF88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }
        .growth-card .value.negative {
            color: #FF0055;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.2);
        }
        .growth-card .value.neutral {
            color: #FFB300;
            text-shadow: 0 0 20px rgba(255, 179, 0, 0.2);
        }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 22px;
            padding: 18px 14px;
            text-align: center;
            transition: all 0.4s;
            position: relative;
        }

        .stat-card:hover {
            border-color: rgba(255, 179, 0, 0.12);
            transform: translateY(-4px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
        }

        .stat-card .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            color: #FFFFFF;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .stat-card .value.gold {
            color: #FFB300;
            text-shadow: 0 0 30px rgba(255, 179, 0, 0.15);
        }
        .stat-card .value.blue {
            color: #00D4FF;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
        }
        .stat-card .value.green {
            color: #00FF88;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.15);
        }
        .stat-card .value.pink {
            color: #FF6B9D;
            text-shadow: 0 0 30px rgba(255, 107, 157, 0.15);
        }

        .stat-card .label {
            font-size: 12px;
            font-weight: 600;
            color: #4A5A7A;
            letter-spacing: 2.5px;
            margin-top: 4px;
            text-transform: uppercase;
            font-family: 'Rajdhani', sans-serif;
        }

        /* ===== CHART ===== */
        .chart-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 26px;
            padding: 20px;
            margin-bottom: 18px;
            position: relative;
            transition: all 0.4s;
        }

        .chart-container:hover {
            border-color: rgba(255, 179, 0, 0.06);
        }

        .chart-container canvas {
            width: 100% !important;
            height: 320px !important;
        }

        .chart-title {
            font-size: 13px;
            font-weight: 600;
            color: #4A5A7A;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
        }

        .chart-title .badge {
            background: rgba(255, 179, 0, 0.06);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: #FFB300;
            letter-spacing: 1.5px;
            border: 1px solid rgba(255, 179, 0, 0.06);
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            justify-content: center;
        }

        .btn {
            padding: 14px 34px;
            border: none;
            border-radius: 40px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-gold {
            background: linear-gradient(135deg, #FFB300, #FF8F00);
            color: #05080F;
            box-shadow: 0 4px 40px rgba(255, 179, 0, 0.15);
        }

        .btn-gold:hover {
            box-shadow: 0 8px 60px rgba(255, 179, 0, 0.3);
            transform: translateY(-3px) scale(1.03);
        }

        .btn-cyan {
            background: linear-gradient(135deg, #00D4FF, #0091EA);
            color: #05080F;
            box-shadow: 0 4px 40px rgba(0, 212, 255, 0.15);
        }

        .btn-cyan:hover {
            box-shadow: 0 8px 60px rgba(0, 212, 255, 0.3);
            transform: translateY(-3px) scale(1.03);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.06);
            color: #B0C4DE;
        }

        .btn-outline:hover {
            border-color: rgba(255, 255, 255, 0.15);
            color: #FFFFFF;
            background: rgba(255, 255, 255, 0.02);
        }

        /* ===== STATUS ===== */
        .status-msg {
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #3A4A5A;
            padding: 4px 0 8px 0;
            letter-spacing: 1.5px;
            font-family: 'Rajdhani', sans-serif;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 8, 15, 0.95);
            backdrop-filter: blur(20px);
            color: #E8EDF5;
            padding: 16px 32px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 15px;
            font-weight: 600;
            font-family: 'Rajdhani', sans-serif;
            z-index: 999;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
            transition: all 0.4s ease;
            letter-spacing: 1px;
        }

        .toast.success {
            border-color: rgba(0, 255, 136, 0.2);
        }
        .toast.error {
            border-color: rgba(255, 0, 85, 0.2);
        }
        .toast.info {
            border-color: rgba(0, 212, 255, 0.2);
        }
        .toast.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(30px);
            pointer-events: none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container {
                padding: 20px 16px 24px;
                border-radius: 28px;
            }
            .logo-text {
                font-size: 22px;
            }
            .price-value {
                font-size: 50px;
            }
            .price-value .dollar {
                font-size: 30px;
            }
            .price-value .cents {
                font-size: 26px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .stat-card {
                padding: 14px 10px;
            }
            .stat-card .value {
                font-size: 20px;
            }
            .growth-grid {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 8px;
            }
            .growth-card .value {
                font-size: 20px;
            }
            .chart-container canvas {
                height: 200px !important;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .price-section {
                padding: 20px 12px 18px;
            }
            .btn {
                font-size: 13px;
                padding: 12px 22px;
            }
        }

        @media (max-width: 400px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat-card .value {
                font-size: 18px;
            }
            .growth-grid {
                grid-template-columns: 1fr;
            }
            .price-value {
                font-size: 38px;
            }
            .price-value .dollar {
                font-size: 22px;
            }
            .price-value .cents {
                font-size: 20px;
            }
            .btn-group {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <!-- ===== BACKGROUND ===== -->
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <!-- ===== SPARKLES ===== -->
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast hidden"></div>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div class="logo-section">
                <span class="logo-icon">✦</span>
                <span class="logo-text">GAD <small>TOKEN</small></span>
            </div>
            <a href="https://gad-token-trade-EN.vercel.app" target="_blank" class="trade-link">
                ⚡ TRADE NOW
            </a>
        </div>
        <div class="divider"></div>

        <!-- PRICE -->
        <div class="price-section">
            <div class="price-label">✦ GAD / USDT ✦</div>
            <div class="price-value" id="priceDisplay">
                <span class="dollar">$</span><span id="priceValue">--</span><span class="cents" id="priceCents">.----</span>
            </div>
            <div id="priceChange" class="price-change">--</div>
            <div class="price-update-time" id="updateTime">⏳ LOADING DATA...</div>
        </div>

        <!-- GROWTH -->
        <div class="growth-grid">
            <div class="growth-card">
                <div class="period">⚡ 30 DAYS</div>
                <div class="value" id="growth30">--</div>
            </div>
            <div class="growth-card">
                <div class="period">⚡ 90 DAYS</div>
                <div class="value" id="growth90">--</div>
            </div>
            <div class="growth-card">
                <div class="period">⚡ 180 DAYS</div>
                <div class="value" id="growth180">--</div>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="icon">👥</span>
                <div class="value gold" id="holderCount">--</div>
                <div class="label">Holders</div>
            </div>
            <div class="stat-card">
                <span class="icon">🔄</span>
                <div class="value blue" id="circulatingSupply">--</div>
                <div class="label">Circulation</div>
            </div>
            <div class="stat-card">
                <span class="icon">📈</span>
                <div class="value green" id="marketCap">--</div>
                <div class="label">Market Cap</div>
            </div>
            <div class="stat-card">
                <span class="icon">💰</span>
                <div class="value pink" id="totalSupply">--</div>
                <div class="label">Total Supply</div>
            </div>
        </div>

        <!-- CHART -->
        <div class="chart-container">
            <div class="chart-title">
                <span>📊 PRICE HISTORY <span id="dataRange"></span></span>
                <span class="badge" id="dataStatus">LIVE</span>
            </div>
            <canvas id="priceChart"></canvas>
        </div>

        <!-- BUTTONS -->
        <div class="btn-group">
            <button id="btnRefresh" class="btn btn-gold">⟳ REFRESH</button>
            <button id="btnFetchLive" class="btn btn-cyan">📡 FETCH LIVE</button>
        </div>

        <div class="status-msg" id="statusMsg">⚡ DATA FROM BLOCKCHAIN • NO WALLET REQUIRED</div>

    </div>

    <!-- ================================================================
    JAVASCRIPT
    ================================================================ -->
    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const CONFIG = {
            GAD_TOKEN_ADDRESS: '0x3A2F29a2B8D38EcF1E3CF72f698C570594e6628c',
            DECIMALS: 18,
            EXPLORER_URL: 'https://bscscan.com',
            DATA_URL: 'data/price-history.json'
        };

        // ============================================================
        // ABI
        // ============================================================
        const GAD_ABI = [
            'function price() view returns (uint256)',
            'function holderCount() view returns (uint256)',
            'function getTotalGADSupply() view returns (uint256)',
            'function getMarketCap() view returns (uint256)',
            'function getCirculatingSupply() view returns (uint256)'
        ];

        // ============================================================
        // STATE
        // ============================================================
        let priceHistory = [];
        let chart = null;
        let currentPrice = 0;

        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        const priceValue = $('priceValue');
        const priceCents = $('priceCents');
        const priceChange = $('priceChange');
        const updateTime = $('updateTime');
        const holderCount = $('holderCount');
        const circulatingSupply = $('circulatingSupply');
        const marketCap = $('marketCap');
        const totalSupply = $('totalSupply');
        const toast = $('toast');
        const statusMsg = $('statusMsg');
        const dataStatus = $('dataStatus');
        const dataRange = $('dataRange');
        const growth30 = $('growth30');
        const growth90 = $('growth90');
        const growth180 = $('growth180');

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimer = null;

        function showToast(msg, type = 'info', duration = 4000) {
            toast.textContent = msg;
            toast.className = `toast ${type}`;
            toast.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('hidden');
            }, duration);
        }

        // ============================================================
        // FETCH DATA
        // ============================================================
        async function fetchDataFromServer() {
            try {
                const response = await fetch(CONFIG.DATA_URL + '?t=' + Date.now());
                if (!response.ok) throw new Error('Failed to fetch data');
                const data = await response.json();
                return data;
            } catch (err) {
                console.warn('Server fetch error:', err.message);
                return null;
            }
        }

        // ============================================================
        // FETCH LIVE PRICE (MULTIPLE RPC)
        // ============================================================
        async function fetchLivePrice() {
            const rpcList = [
                'https://bsc-dataseed.binance.org/',
                'https://bsc-dataseed1.binance.org/',
                'https://bsc-dataseed2.binance.org/',
                'https://bsc-dataseed3.binance.org/',
                'https://bsc-dataseed4.binance.org/',
                'https://bsc-dataseed1.defibit.io/',
                'https://bsc-dataseed2.defibit.io/',
                'https://bsc-dataseed3.defibit.io/',
                'https://bsc-dataseed4.defibit.io/'
            ];

            for (const rpc of rpcList) {
                try {
                    const provider = new ethers.JsonRpcProvider(rpc);
                    const contract = new ethers.Contract(CONFIG.GAD_TOKEN_ADDRESS, GAD_ABI, provider);
                    const price = await contract.price();
                    if (price) {
                        const formattedPrice = parseFloat(ethers.formatUnits(price, CONFIG.DECIMALS));
                        console.log(`✅ Price from: ${rpc} -> ${formattedPrice}`);
                        return formattedPrice;
                    }
                } catch (err) {
                    continue;
                }
            }
            return null;
        }

        // ============================================================
        // FETCH LIVE STATS
        // ============================================================
        async function fetchLiveStats() {
            const rpcList = [
                'https://bsc-dataseed.binance.org/',
                'https://bsc-dataseed1.binance.org/',
                'https://bsc-dataseed2.binance.org/'
            ];

            for (const rpc of rpcList) {
                try {
                    const provider = new ethers.JsonRpcProvider(rpc);
                    const contract = new ethers.Contract(CONFIG.GAD_TOKEN_ADDRESS, GAD_ABI, provider);

                    try {
                        const holders = await contract.holderCount();
                        holderCount.textContent = formatNumber(holders.toString());
                    } catch (e) { holderCount.textContent = '--'; }

                    try {
                        const supply = await contract.getTotalGADSupply();
                        totalSupply.textContent = formatNumber(ethers.formatUnits(supply, 18));
                    } catch (e) { totalSupply.textContent = '--'; }

                    try {
                        const cap = await contract.getMarketCap();
                        marketCap.textContent = formatNumber(ethers.formatUnits(cap, 18));
                    } catch (e) { marketCap.textContent = '--'; }

                    try {
                        const circ = await contract.getCirculatingSupply();
                        circulatingSupply.textContent = formatNumber(ethers.formatUnits(circ, 18));
                    } catch (e) { circulatingSupply.textContent = '--'; }

                    return true;
                } catch (err) {
                    continue;
                }
            }
            return false;
        }

        // ============================================================
        // UPDATE PRICE
        // ============================================================
        function updatePriceDisplay(price) {
            if (price === null || price === undefined) return;
            currentPrice = price;

            const parts = price.toFixed(10).split('.');
            priceValue.textContent = parts[0];
            priceCents.textContent = '.' + (parts[1] || '0000').padEnd(7, '0').slice(0, 7);
        }

        function updateGrowthMetrics(data) {
            if (!data || data.length < 2) {
                growth30.textContent = '--';
                growth90.textContent = '--';
                growth180.textContent = '--';
                return;
            }

            const today = data[data.length - 1].price;
            const todayDate = new Date(data[data.length - 1].date);

            const date30 = new Date(todayDate);
            date30.setDate(date30.getDate() - 30);
            let price30 = null;
            for (let i = data.length - 1; i >= 0; i--) {
                const d = new Date(data[i].date);
                if (d <= date30) { price30 = data[i].price; break; }
            }
            if (!price30 && data.length > 0) price30 = data[0].price;

            const date90 = new Date(todayDate);
            date90.setDate(date90.getDate() - 90);
            let price90 = null;
            for (let i = data.length - 1; i >= 0; i--) {
                const d = new Date(data[i].date);
                if (d <= date90) { price90 = data[i].price; break; }
            }
            if (!price90 && data.length > 0) price90 = data[0].price;

            const date180 = new Date(todayDate);
            date180.setDate(date180.getDate() - 180);
            let price180 = null;
            for (let i = data.length - 1; i >= 0; i--) {
                const d = new Date(data[i].date);
                if (d <= date180) { price180 = data[i].price; break; }
            }
            if (!price180 && data.length > 0) price180 = data[0].price;

            growth30.innerHTML = formatPercent(price30, today);
            growth90.innerHTML = formatPercent(price90, today);
            growth180.innerHTML = formatPercent(price180, today);
        }

        function formatPercent(oldPrice, newPrice) {
            if (!oldPrice || oldPrice === 0) return '--';
            const change = ((newPrice - oldPrice) / oldPrice) * 100;
            const sign = change >= 0 ? '+' : '';
            const color = change > 0 ? 'positive' : (change < 0 ? 'negative' : 'neutral');
            return `<span class="${color}">${sign}${change.toFixed(2)}%</span>`;
        }

        function formatNumber(num) {
            if (!num) return '--';
            const n = parseFloat(num);
            if (isNaN(n)) return '--';
            if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
            if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K';
            return n.toFixed(2);
        }

        // ============================================================
        // CHART
        // ============================================================
        function initChart(data) {
            const ctx = document.getElementById('priceChart').getContext('2d');

            const chartData = {
                labels: data.map(p => p.date),
                datasets: [{
                    label: 'GAD Price (USDT)',
                    data: data.map(p => p.price),
                    borderColor: '#FFB300',
                    backgroundColor: 'rgba(255, 179, 0, 0.04)',
                    borderWidth: 3,
                    pointBackgroundColor: '#FFB300',
                    pointRadius: data.length > 100 ? 0.5 : 1.5,
                    pointHoverRadius: 7,
                    fill: true,
                    tension: 0.3,
                    borderJoinStyle: 'round'
                }]
            };

            chart = new Chart(ctx, {
                type: 'line',
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#4A5A7A',
                                font: { size: 12, family: 'Rajdhani, sans-serif', weight: '600' }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(5,8,15,0.95)',
                            titleColor: '#FFFFFF',
                            bodyColor: '#FFB300',
                            borderColor: 'rgba(255,179,0,0.1)',
                            borderWidth: 1,
                            cornerRadius: 14,
                            padding: 16,
                            titleFont: { family: 'Rajdhani, sans-serif', size: 14, weight: '600' },
                            bodyFont: { family: 'Rajdhani, sans-serif', size: 14, weight: '700' },
                            callbacks: {
                                label: function(context) {
                                    return '$' + context.parsed.y.toFixed(7) + ' USDT';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(255,255,255,0.02)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#3A4A5A',
                                font: { size: 10, family: 'Rajdhani, sans-serif', weight: '600' },
                                maxTicksLimit: data.length > 180 ? 15 : 12,
                                maxRotation: 45,
                                autoSkip: true
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(255,255,255,0.02)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#3A4A5A',
                                font: { size: 11, family: 'Rajdhani, sans-serif', weight: '600' },
                                callback: function(value) {
                                    return '$' + value.toFixed(7);
                                }
                            }
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });
        }

        function updateChart(data) {
            if (!chart) return;
            chart.data.labels = data.map(p => p.date);
            chart.data.datasets[0].data = data.map(p => p.price);
            chart.update('none');
        }

        // ============================================================
        // SAMPLE DATA
        // ============================================================
        function generateSampleData() {
            const data = [];
            const startPrice = 0.01;
            const endPrice = 0.010004326799;
            const days = 180;

            for (let i = 0; i <= days; i++) {
                const date = new Date();
                date.setDate(date.getDate() - (days - i));
                const progress = i / days;
                const basePrice = startPrice + (endPrice - startPrice) * progress;
                const variation = 1 + (Math.random() - 0.5) * 0.06;
                data.push({
                    date: date.toISOString().split('T')[0],
                    price: Math.max(0.009, basePrice * variation)
                });
            }
            data[data.length - 1].price = endPrice;
            return data;
        }

        // ============================================================
        // MAIN LOAD
        // ============================================================
        async function loadDashboard() {
            statusMsg.textContent = '⏳ LOADING DATA...';
            dataStatus.textContent = 'LOADING';

            const data = await fetchDataFromServer();

            if (data && data.length > 0) {
                priceHistory = data;
                const lastPrice = data[data.length - 1].price;
                updatePriceDisplay(lastPrice);

                const lastDate = new Date(data[data.length - 1].date);
                updateTime.textContent = `🕐 UPDATED: ${lastDate.toLocaleDateString()} ${lastDate.toLocaleTimeString()}`;

                const firstDate = new Date(data[0].date);
                dataRange.textContent = `(${firstDate.toLocaleDateString()} - ${lastDate.toLocaleDateString()})`;

                updateGrowthMetrics(data);

                if (chart) {
                    updateChart(data);
                } else {
                    initChart(data);
                }

                dataStatus.textContent = `${data.length} DAYS`;
                statusMsg.textContent = `⚡ DATA FROM BLOCKCHAIN • ${data.length} DAYS RECORDED`;
                showToast(`✅ Loaded ${data.length} days of price data`, 'success', 2000);

                await fetchLiveStats();

            } else {
                const sampleData = generateSampleData();
                priceHistory = sampleData;
                updatePriceDisplay(sampleData[sampleData.length - 1].price);
                updateGrowthMetrics(sampleData);
                if (chart) {
                    updateChart(sampleData);
                } else {
                    initChart(sampleData);
                }
                dataStatus.textContent = 'DEMO';
                statusMsg.textContent = '⚠️ DEMO DATA • CONNECT TO BLOCKCHAIN FOR LIVE PRICE';
                showToast('⚠️ Using demo data', 'info', 3000);
            }
        }

        // ============================================================
        // REFRESH & FETCH LIVE
        // ============================================================
        async function refreshData() {
            showToast('⟳ REFRESHING...', 'info', 1500);
            await loadDashboard();
        }

        async function fetchLiveAndUpdate() {
            showToast('📡 FETCHING LIVE PRICE...', 'info', 1500);
            const price = await fetchLivePrice();
            if (price !== null) {
                updatePriceDisplay(price);
                const today = new Date().toISOString().split('T')[0];
                const lastEntry = priceHistory[priceHistory.length - 1];
                if (lastEntry && lastEntry.date !== today) {
                    priceHistory.push({ date: today, price: price });
                    if (priceHistory.length > 365) {
                        priceHistory = priceHistory.slice(-365);
                    }
                    updateGrowthMetrics(priceHistory);
                    updateChart(priceHistory);
                }
                await fetchLiveStats();
                showToast(`✅ LIVE PRICE: $${price.toFixed(7)}`, 'success', 2000);
            } else {
                showToast('⚠️ COULD NOT FETCH LIVE PRICE', 'error', 2000);
            }
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        document.addEventListener('DOMContentLoaded', async () => {
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js';
            script.onload = async function() {
                await loadDashboard();
                setTimeout(fetchLiveAndUpdate, 2000);
            };
            document.head.appendChild(script);

            $('btnRefresh').addEventListener('click', refreshData);
            $('btnFetchLive').addEventListener('click', fetchLiveAndUpdate);

            setInterval(async () => {
                await loadDashboard();
            }, 300000);

            console.log('🚀 GAD PRICE DASHBOARD LOADED');
        });
    </script>

</body>
</html>
